name: Pré-vendas — Check Diário (Vinicius)

on:
  # Agendamento migrou pro Railway (projeto prevendas-reports, 8h BRT) porque o cron
  # do GitHub atrasava horas. Este workflow ficou só como disparo manual de contingência.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checkin-diario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Manda o check diário na DM do pré-vendedor
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python3 cli.py checkin-diario
