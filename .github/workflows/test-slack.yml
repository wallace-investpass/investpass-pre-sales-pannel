name: Pré-vendas — Teste de conexão Slack

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-slack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Valida SLACK_BOT_TOKEN (auth.test + DM de teste)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python3 cli.py test-slack
