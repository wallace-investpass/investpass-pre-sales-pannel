name: Pré-vendas — Weekly Report

on:
  schedule:
    # 8h de Brasília (UTC-3) = 11h UTC, toda segunda-feira.
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Publica o Weekly Report no Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python3 cli.py report-semanal
